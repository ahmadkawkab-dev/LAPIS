services:
  db:
    image: postgres:17-alpine
    env_file: .env.docker
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
  
  api:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env.api
    environment:
      DataProtection__KeysPath: /app/App_Data/data-protection-keys
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Postgres: "Host=db;Port=5432;Database=${POSTGRES_DB:?};Username=${POSTGRES_USER:?};Password=${POSTGRES_PASSWORD:?}"
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:8081:8080"
    volumes:
      - profile_images:/app/App_Data/profile-images
      - data_protection_keys:/app/App_Data/data-protection-keys
  
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    depends_on:
      - api
    ports:
      - "127.0.0.1:8082:8080"

  cloudflared:
     image: cloudflare/cloudflared:latest
     command: tunnel --no-autoupdate run
     restart: unless-stopped
     env_file:
       - .env.tunnel
     depends_on:
       - frontend

volumes:
  postgres_data:
  profile_images:
  data_protection_keys:
